<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<!--
  قالب «أرقام كرة القدم» — فيديو عمودي 1080×1920 للتيك توك.
  المشاهد والنصوص تأتي من ملف الحلقة (episodes/*.json) عبر window.EPISODE.
  الحركة كلها محسوبة من الزمن t (بدون CSS animation) حتى يكون التصدير إطارًا بإطار دقيقًا.
  مناطق تيك توك الآمنة: لا نص مهم في أعلى 160px ولا أسفل 420px ولا يمين 140px.
-->
<style>
  @font-face { font-family: Cairo; font-weight: 400; src: url(../node_modules/@fontsource/cairo/files/cairo-arabic-400-normal.woff2); unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE80-FEFC; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2); unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE80-FEFC; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2); unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE80-FEFC; }
  @font-face { font-family: Cairo; font-weight: 400; src: url(../node_modules/@fontsource/cairo/files/cairo-latin-400-normal.woff2); unicode-range: U+0000-00FF, U+2010-2011, U+2212; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../node_modules/@fontsource/cairo/files/cairo-latin-700-normal.woff2); unicode-range: U+0000-00FF, U+2010-2011, U+2212; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../node_modules/@fontsource/cairo/files/cairo-latin-900-normal.woff2); unicode-range: U+0000-00FF, U+2010-2011, U+2212; }

  :root { --yellow: #FFE81F; --red: #E11D2E; --ink: #111; --accent: #6CABDD; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1920px; background: #000; font-family: Cairo, sans-serif; overflow: hidden; color: var(--ink); position: relative; }

  #title { position: absolute; top: 170px; left: 50%; transform: translateX(-50%); background: var(--yellow); padding: 6px 40px 14px; border-radius: 18px; font-weight: 900; font-size: 54px; white-space: nowrap; }
  #stage { position: absolute; top: 290px; left: 40px; right: 40px; height: 960px; background: #fff; border-radius: 34px; overflow: hidden; }
  #sub { position: absolute; top: 1275px; left: 60px; right: 150px; height: 220px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 56px; text-align: center; line-height: 1.45; }
  #sub b { color: var(--yellow); font-weight: 900; }
  #logo { position: absolute; left: 28px; bottom: 28px; width: 160px; height: 160px; border-radius: 50%; background: var(--ink); border: 6px solid var(--yellow); color: var(--yellow); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 28px; z-index: 5; overflow: hidden; }
  #logo img { width: 100%; height: 100%; object-fit: cover; }
  #progress { position: absolute; top: 1258px; left: 40px; right: 40px; height: 8px; border-radius: 4px; background: #333; overflow: hidden; }
  #progress i { display: block; height: 100%; width: 0; background: var(--yellow); }

  .scene { position: absolute; inset: 0; opacity: 0; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 50px; }
  .big { font-weight: 900; font-size: 330px; line-height: 1.05; font-variant-numeric: tabular-nums; direction: ltr; }
  .label { font-weight: 900; font-size: 66px; line-height: 1.35; }
  .note { font-weight: 700; font-size: 44px; color: #555; margin-top: 10px; }
  .red { color: var(--red); }
  .tag { display: inline-block; background: var(--ink); color: #fff; border-radius: 14px; padding: 4px 26px 10px; font-weight: 700; font-size: 44px; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  .bars { position: absolute; left: 50px; right: 50px; top: 50%; transform: translateY(-50%); }
  .bars h3 { font-size: 54px; font-weight: 900; margin-bottom: 30px; text-align: center; }
  .row { display: flex; align-items: center; gap: 22px; height: 150px; }
  .name { width: 290px; font-weight: 900; font-size: 46px; text-align: right; line-height: 1.15; }
  .name small { display: block; font-size: 30px; color: #666; font-weight: 700; }
  .track { flex: 1; height: 90px; position: relative; }
  .bar { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 14px; background: #d3d8de; display: flex; align-items: center; padding-left: 20px; font-weight: 900; font-size: 52px; direction: ltr; min-width: 0; }
  .bar.hl { background: var(--accent); }

  .cmp { display: flex; gap: 80px; align-items: flex-end; justify-content: center; }
  .col .n { font-weight: 900; font-size: 210px; line-height: 1; }
  .col .d { font-weight: 700; font-size: 42px; color: #444; line-height: 1.4; }

  .icons { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; max-width: 760px; margin: 40px 0; }
  .icons svg { width: 150px; height: 150px; }
</style>
</head>
<body>
  <div id="title"></div>
  <div id="stage"><div id="logo"></div></div>
  <div id="progress"><i></i></div>
  <div id="sub"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /** **كلمة** في النص = تمييز باللون */
  const rich = (s, cls = 'red') => esc(s).replace(/&lt;br&gt;/g, '<br>').replace(/\*\*(.+?)\*\*/g, `<span class="${cls}">$1</span>`);
  const FADE = 0.35;

  const BALL = `<svg viewBox="-40 -40 80 80"><circle r="34" fill="#fff" stroke="#111" stroke-width="5"/><path d="M0-14 13-4 8 12-8 12-13-4Z" fill="#111"/></svg>`;

  /** أنواع المشاهد: build() يبني العناصر مرة واحدة، update(local) يحرّكها حسب الزمن داخل المشهد */
  const TYPES = {
    hook(s, el) {
      el.innerHTML = `
        <svg viewBox="0 0 1000 960" style="position:absolute;inset:0;width:100%;height:100%">
          <g stroke="#1a1a1a" stroke-width="6" fill="none" class="lines">
            <rect x="120" y="90" width="760" height="780" rx="8" pathLength="1"/>
            <line x1="120" y1="480" x2="880" y2="480" pathLength="1"/>
            <circle cx="500" cy="480" r="95" pathLength="1"/>
            <rect x="330" y="90" width="340" height="150" pathLength="1"/>
            <rect x="330" y="720" width="340" height="150" pathLength="1"/>
          </g>
          <g class="ball">${BALL.replace('<svg viewBox="-40 -40 80 80">', '').replace('</svg>', '')}</g>
        </svg>
        <div class="center"><div class="hooktext" style="background:#fff;padding:20px 40px 34px;border-radius:30px">
          ${s.lines.map((l) => `<div class="label" style="font-size:84px">${rich(l)}</div>`).join('')}
        </div></div>`;
      return (u) => {
        const d = easeInOut(prog(u, 0.05, 1.6));
        el.querySelectorAll('.lines > *').forEach((n) => { n.setAttribute('stroke-dasharray', '1'); n.setAttribute('stroke-dashoffset', String(1 - d)); });
        const y = 1000 - easeOut(prog(u, 0.6, 1.9)) * 520;
        el.querySelector('.ball').setAttribute('transform', `translate(500 ${y}) rotate(${y}) scale(1.4)`);
        const h = el.querySelector('.hooktext');
        h.style.opacity = prog(u, 1.6, 2.0);
        h.style.transform = `scale(${0.6 + 0.4 * back(prog(u, 1.6, 2.3))})`;
      };
    },

    counter(s, el) {
      el.innerHTML = `<div class="center">
        ${s.tag ? `<div class="tag"><span class="ltr">${esc(s.tag)}</span></div>` : ''}
        <div class="big ${s.color === 'red' ? 'red' : ''}">0</div>
        <div class="label">${rich(s.label)}</div>
        ${s.note ? `<div class="note">${rich(s.note)}</div>` : ''}</div>`;
      const big = el.querySelector('.big');
      const decimals = s.decimals ?? 0;
      return (u) => {
        const p = easeOut(prog(u, 0.4, s.countSeconds ?? 2.6));
        const from = s.from ?? 0;
        big.textContent = (from + (s.value - from) * p).toFixed(decimals);
        big.style.transform = `scale(${1 + 0.08 * Math.sin(prog(u, s.countSeconds ?? 2.6, (s.countSeconds ?? 2.6) + 0.6) * Math.PI)})`;
        const note = el.querySelector('.note');
        if (note) note.style.opacity = prog(u, (s.countSeconds ?? 2.6) + 0.3, (s.countSeconds ?? 2.6) + 0.8);
      };
    },

    bars(s, el) {
      const max = Math.max(...s.rows.map((r) => r.value));
      el.innerHTML = `<div class="bars">${s.heading ? `<h3>${rich(s.heading)}</h3>` : ''}${s.rows
        .map((r) => `<div class="row"><div class="name">${esc(r.name)}${r.sub ? `<small><span class="ltr">${esc(r.sub)}</span></small>` : ''}</div>
          <div class="track"><div class="bar ${r.highlight ? 'hl' : ''}"><span>0</span></div></div></div>`)
        .join('')}</div>`;
      const bars = [...el.querySelectorAll('.bar')];
      return (u) => s.rows.forEach((r, i) => {
        const p = easeOut(prog(u, 0.4 + i * 0.55, 1.9 + i * 0.55));
        bars[i].style.width = p > 0 ? `max(${(r.value / max) * 100 * p}%, 110px)` : '0';
        bars[i].firstElementChild.textContent = Math.round(r.value * p);
      });
    },

    compare(s, el) {
      el.innerHTML = `<div class="center"><div class="cmp">${s.items
        .map((it) => `<div class="col"><div class="n ${it.highlight ? 'red' : ''}">${esc(it.value)}</div><div class="d">${rich(it.label)}</div></div>`)
        .join('')}</div>${s.tag ? `<div class="tag" style="margin-top:70px;font-size:50px">${rich(s.tag, '')}</div>` : ''}</div>`;
      const cols = [...el.querySelectorAll('.col')];
      return (u) => {
        cols.forEach((c, i) => {
          c.style.opacity = prog(u, 0.3 + i * 1, 0.8 + i * 1);
          c.style.transform = `scale(${0.7 + 0.3 * back(prog(u, 0.3 + i * 1, 0.9 + i * 1))})`;
        });
        const tag = el.querySelector('.tag');
        if (tag) tag.style.opacity = prog(u, 0.5 + cols.length, 1 + cols.length);
      };
    },

    icons(s, el) {
      el.innerHTML = `<div class="center"><div class="label">${rich(s.label)}</div>
        <div class="icons">${Array.from({ length: s.count }, () => BALL).join('')}</div>
        ${s.note ? `<div class="note">${rich(s.note)}</div>` : ''}</div>`;
      const icons = [...el.querySelectorAll('.icons svg')];
      return (u) => {
        icons.forEach((ic, i) => {
          const p = prog(u, 0.5 + i * 0.35, 0.9 + i * 0.35);
          ic.style.opacity = p;
          ic.style.transform = `scale(${back(p)}) rotate(${(1 - p) * -180}deg)`;
        });
        const note = el.querySelector('.note');
        if (note) note.style.opacity = prog(u, 0.6 + icons.length * 0.35, 1 + icons.length * 0.35);
      };
    },
  };

  window.setup = function (ep) {
    $('title').textContent = ep.title;
    $('logo').innerHTML = ep.logo ? `<img src="${esc(ep.logo)}">` : esc(ep.logoText ?? 'شعارك');
    const stage = $('stage');
    window.__scenes = ep.scenes.map((s) => {
      const el = document.createElement('div');
      el.className = 'scene';
      stage.appendChild(el);
      return { s, el, update: TYPES[s.type](s, el) };
    });
    window.__ep = ep;
  };

  window.render = function (t) {
    const ep = window.__ep;
    for (const { s, el, update } of window.__scenes) {
      const op = Math.min(prog(t, s.start, s.start + FADE), 1 - prog(t, s.end - FADE, s.end));
      el.style.opacity = op;
      if (op > 0) update(t - s.start);
    }
    const sub = ep.subtitles.find((x) => t >= x[0] && t < x[1]);
    // نلف النص في div حتى لا يحوّل flex الكلمات الملونة إلى عناصر منفصلة تأكل المسافات
    $('sub').innerHTML = sub ? `<div>${rich(sub[2], 'y').replace(/class="y"/g, 'style="color:var(--yellow)"')}</div>` : '';
    $('progress').firstElementChild.style.width = `${(t / ep.duration) * 100}%`;
  };

  if (window.EPISODE) { window.setup(window.EPISODE); window.render(0); }
</script>
</body>
</html>
