<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Home / X (test fixture)</title>
    <style>
      body { margin: 0; font-family: sans-serif; background-color: rgb(255, 255, 255); color: #0f1419; }
      body.dark { background-color: rgb(0, 0, 0); color: #e7e9ea; }
      main { max-width: 600px; margin: 0 auto; }
      article { border-bottom: 1px solid #8884; padding: 12px 16px; }
      [data-testid="videoPlayer"] { margin-top: 8px; border-radius: 16px; overflow: hidden; }
      video { width: 100%; display: block; background: #000; }
    </style>
  </head>
  <body>
    <!-- صفحة اختبار تحاكي بنية X (data-testid) — تُخدم على https://x.com عبر Playwright route -->
    <main id="timeline">
      <article data-testid="tweet" id="t1">
        <div>
          <div data-testid="User-Name"><a href="/gardener">Gardener</a></div>
          <a href="/gardener/status/1001">2h</a>
          <div data-testid="tweetText" lang="en">Hello everyone</div>
          <div data-testid="videoPlayer"><div><video id="v1" src="/__fixture/clip.webm" playsinline loop></video></div></div>
        </div>
      </article>
      <article data-testid="tweet" id="t2">
        <div>
          <div data-testid="User-Name"><a href="/private_person">Private</a><svg data-testid="icon-lock"></svg></div>
          <a href="/private_person/status/1002">3h</a>
          <div data-testid="tweetText" lang="en">This is a protected account</div>
        </div>
      </article>
      <article data-testid="tweet" id="t3">
        <div>
          <div data-testid="User-Name"><a href="/arabic">عربي</a></div>
          <a href="/arabic/status/1003">4h</a>
          <div data-testid="tweetText" lang="ar">تغريدة عربية لا تحتاج ترجمة</div>
        </div>
      </article>
    </main>
    <script>
      if (location.search.includes('theme=dark')) document.body.classList.add('dark');
      // محاكاة التمرير اللانهائي: يضيف تغريدة فيديو جديدة
      window.addVideoTweet = function (id) {
        const a = document.createElement('article');
        a.setAttribute('data-testid', 'tweet');
        a.id = 'dyn' + id;
        a.innerHTML =
          '<div><div data-testid="User-Name"><a href="/new' + id + '">New</a></div>' +
          '<a href="/new' + id + '/status/' + (2000 + id) + '">now</a>' +
          '<div data-testid="tweetText" lang="en">Water the plants gently every morning.</div>' +
          '<div data-testid="videoPlayer"><div><video src="/__fixture/clip.webm" playsinline></video></div></div></div>';
        document.getElementById('timeline').appendChild(a);
      };
    </script>
  </body>
</html>
