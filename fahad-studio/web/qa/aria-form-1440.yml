  - region "Four moves, always in order":
    - paragraph: Method
    - heading "Four moves, always in order" [level=2]:
      - text: Four moves, always in
      - emphasis: order
    - list:
      - listitem:
        - text: "01"
        - heading "Read نقرأ" [level=3]
        - paragraph: "One page of brief: the message, the audience and the single image the site must leave behind."
      - listitem:
        - text: "02"
        - heading "Compose نصوغ" [level=3]
        - paragraph: Type, grid and the key visual are fixed as still frames first. If the still is weak, nothing moves yet.
      - listitem:
        - text: "03"
        - heading "Animate نحرّك" [level=3]
        - paragraph: Motion is added where it explains or gives depth — scroll scenes, reveals, quiet hovers. Reduced motion is designed, not removed.
      - listitem:
        - text: "04"
        - heading "Deliver نسلّم" [level=3]
        - paragraph: Tested at phone, tablet and desktop widths, measured for weight, and shown in a short film made from the real site.
